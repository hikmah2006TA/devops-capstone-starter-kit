name: CI/CD Pipeline - Build, Scan and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-and-push:
    name: Build and Publish Container Images
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Vote Image
        uses: docker/build-push-action@v5
        with:
          context: ./capstone-1-voting-app/vote
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_vote:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_vote:latest

      - name: Build Result Image
        uses: docker/build-push-action@v5
        with:
          context: ./capstone-1-voting-app/result
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_result:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_result:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./capstone-1-voting-app/worker
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_worker:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'dockersamples' }}/examplevotingapp_worker:latest
