replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 100m
    memory: 100Mi

service:
  type: ClusterIP
  port: 9115

serviceMonitor:
  enabled: false
  selfMonitor:
    enabled: false

podMonitoring:
  enabled: false
  selfMonitor:
    enabled: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        valid_status_codes: [200]
